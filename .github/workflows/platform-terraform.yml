name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token:      write
  contents:      read
  pull-requests: write

env:
  TF_DIR:              terraform/environments/dev
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY:      ${{ secrets.TF_STATE_STORAGE_KEY }}

jobs:

  # ── Job 1: Security Scan (PR only) ────────────────────────
  # Scans ONLY files changed in this PR
  # Posts findings as PR comment — no need to open logs
  # Blocks plan job if HIGH severity found
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      high-count: ${{ steps.scan.outputs.high_count }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Terraform files
        id: changed
        run: |
          DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.tf$' \
            | xargs -I{} dirname {} \
            | sort -u \
            | tr '\n' ' ')

          if [ -z "$DIRS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_dirs=$DIRS" >> $GITHUB_OUTPUT
            echo "Changed directories: $DIRS"
          fi

      - name: Set up Python
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          pip install checkov openai httpx python-dotenv --quiet
          wget -q -O /usr/local/bin/tfsec \
            https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec

      - name: Run Checkov (changed files only)
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p /tmp/scan-results
          for dir in ${{ steps.changed.outputs.changed_dirs }}; do
            checkov --directory "$dir" \
              --framework terraform \
              --output json \
              --soft-fail --compact \
              2>/dev/null >> /tmp/scan-results/checkov_raw.json || true
          done

          python3 << 'PYEOF'
          import json, os
          raw  = "/tmp/scan-results/checkov_raw.json"
          out  = {"results": {"failed_checks": [], "passed_checks": []}}
          if os.path.exists(raw):
              for line in open(raw).read().split('\n'):
                  line = line.strip()
                  if not line: continue
                  try:
                      d = json.loads(line)
                      r = d.get("results", d)
                      if isinstance(r, dict):
                          out["results"]["failed_checks"].extend(r.get("failed_checks", []))
                          out["results"]["passed_checks"].extend(r.get("passed_checks", []))
                  except: pass
          json.dump(out, open("/tmp/scan-results/checkov.json","w"))
          print(f"Checkov: {len(out['results']['failed_checks'])} failures")
          PYEOF
        continue-on-error: true

      - name: Run tfsec (changed files only)
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p /tmp/scan-results
          for dir in ${{ steps.changed.outputs.changed_dirs }}; do
            tfsec "$dir" --format json --soft-fail \
              2>/dev/null >> /tmp/scan-results/tfsec_raw.json || true
          done

          python3 << 'PYEOF'
          import json, os
          raw = "/tmp/scan-results/tfsec_raw.json"
          out = {"results": []}
          if os.path.exists(raw):
              for line in open(raw).read().split('\n'):
                  line = line.strip()
                  if not line: continue
                  try:
                      d = json.loads(line)
                      out["results"].extend(d.get("results", []))
                  except: pass
          json.dump(out, open("/tmp/scan-results/tfsec.json","w"))
          print(f"tfsec: {len(out['results'])} findings")
          PYEOF
        continue-on-error: true

      - name: Checkout security-auditor (AI explainer)
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/checkout@v4
        with:
          repository: vmprachi7/security-auditor
          path: .security-auditor

      - name: Generate AI-explained findings
        if: steps.changed.outputs.has_changes == 'true'
        id: scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          [ -f /tmp/scan-results/checkov.json ] || \
            echo '{"results":{"failed_checks":[]}}' > /tmp/scan-results/checkov.json
          [ -f /tmp/scan-results/tfsec.json ] || \
            echo '{"results":[]}' > /tmp/scan-results/tfsec.json

          PYTHONPATH=.security-auditor python \
            .security-auditor/shift-left/ai_explainer.py \
            --checkov /tmp/scan-results/checkov.json \
            --tfsec   /tmp/scan-results/tfsec.json \
            --tf-dir  "${{ env.TF_DIR }}" \
            --output  /tmp/scan-results/pr-comment.md || true

          HIGH=$(python3 -c "
          import json
          data  = json.load(open('/tmp/scan-results/checkov.json'))
          checks = data.get('results', data).get('failed_checks', [])
          high  = {'CKV_AZURE_59','CKV_AZURE_5','CKV_AZURE_7',
                   'CKV_AZURE_41','CKV_AZURE_42','CKV_AZURE_3','CKV_AZURE_110'}
          print(sum(1 for c in checks if c.get('check_id') in high))
          " 2>/dev/null || echo "0")

          echo "high_count=$HIGH" >> $GITHUB_OUTPUT

      - name: Post security findings on PR
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment = '';
            try {
              comment = fs.readFileSync('/tmp/scan-results/pr-comment.md', 'utf8');
            } catch(e) {
              comment = '## ✅ Security Scan\n\nNo issues found in changed Terraform files.';
            }

            // Remove previous scan comments
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of existing.data) {
              if (c.body.includes('Security Scan') && c.user.type === 'Bot') {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Skip message (no tf changes)
        if: steps.changed.outputs.has_changes == 'false'
        run: echo "No Terraform files changed — security scan skipped"

      - name: Block if HIGH findings
        if: steps.scan.outputs.high_count > 0
        run: |
          echo "❌ ${{ steps.scan.outputs.high_count }} HIGH severity finding(s)"
          echo "Fix issues shown in PR comment before merging."
          exit 1

  # ── Job 2: Plan (PR only) ─────────────────────────────────
  # Only runs if security scan passes (no HIGH findings)
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: security-scan
    if: |
      github.event_name == 'pull_request' &&
      (needs.security-scan.outputs.high-count == '0' ||
       needs.security-scan.outputs.high-count == '')

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n...[truncated]'
              : plan;
            const body = [
              '## 🏗️ Terraform Plan',
              '```hcl',
              truncated,
              '```',
              `**Result:** \`${{ steps.plan.outcome }}\``,
              `*Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`*`,
              '',
              '> ✅ Merge this PR to queue the apply — still requires manual approval.',
            ].join('\n');

            // Remove previous plan comments
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of existing.data) {
              if (c.body.includes('Terraform Plan') && c.user.type === 'Bot') {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Job 3: Apply (merge to main only) ────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version:  1.6.6
          terraform_wrapper:  false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Terraform outputs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          terraform output

  # ── Job 4: Destroy (manual only) ─────────────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve

      - name: Confirm
        run: |
          echo "✅ Infrastructure destroyed"
          echo "State file preserved in Azure Blob"