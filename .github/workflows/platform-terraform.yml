name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token:      write
  contents:      read
  pull-requests: write

env:
  TF_DIR:              terraform/environments/dev
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY:      ${{ secrets.TF_STATE_STORAGE_KEY }}

jobs:
  # ── Job 1: Security Scan (PR only) ────────────────────────
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      high-count: ${{ steps.scan.outputs.high_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Terraform files
        id: changed
        run: |
          # Fetch the base branch to ensure diff works
          git fetch origin ${{ github.base_ref }} --depth=1
          
          DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.tf$' \
            | xargs -I{} dirname {} \
            | sort -u \
            | tr '\n' ' ')
          
          if [ -z "$DIRS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No .tf files changed"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_dirs=$DIRS" >> $GITHUB_OUTPUT
            echo "Changed .tf dirs: $DIRS"
          fi

      - name: Set up Python
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          pip install checkov openai httpx python-dotenv --quiet
          wget -q -O /usr/local/bin/tfsec \
            https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec
          echo "✅ Scanners ready"

      - name: Run Checkov
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p /tmp/scan-results
          # Scan changed directories recursively and output to a clean file
          checkov --directory . --external-checks-dir . --quiet \
            --framework terraform --output json --soft-fail \
            --download-external-modules false > /tmp/scan-results/checkov_raw.json || true
          
          python3 << 'PYEOF'
          import json, os
          path = "/tmp/scan-results/checkov_raw.json"
          out = {"results": {"failed_checks": []}}
          if os.path.exists(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
                      # Checkov can return a list or a
